spring.profiles.active=test-h2

# Enable mybatis mapper validation from support library.
mybatis.validation.enabled=true
mybatis.type-handlers-package=com.yichi.infra.support.mybatis.typehandler
mybatis.configuration.object-factory=com.yichi.infra.support.mybatis.Entity.EntityObjectFactory
mybatis.configuration.reflector-factory=com.yichi.infra.support.mybatis.Entity.EntityReflectorFactory
mybatis.configuration.map-underscore-to-camel-case=true