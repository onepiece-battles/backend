spring.datasource.url=jdbc:mysql://localhost:3306/onepiece?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=${PASSWORD}

# let flyway read all migration scripts
spring.flyway.url=jdbc:mysql://localhost:3306/onepiece?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=utf8
spring.flyway.locations=classpath:/db/migration
spring.flyway.enabled=true
spring.flyway.encoding=utf-8
spring.flyway.baseline-on-migrate=true
spring.flyway.user=root
spring.flyway.password=${PASSWORD}

mybatis.type-handlers-package=com.yichi.infra.support.mybatis.typehandler
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:com/yichi/onepiece/**/*.xml
# this is used to debug mybatis sql
#mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

spring.mail.host=smtp.163.com
spring.mail.username=onepiecebattles@163.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.port=465
spring.mail.properties.mail.smtp.ssl.enable=true

spring.servlet.multipart.max-file-size=10MB

com.yichi.onepiece.meters.cache_gauge_name=cache_size

# quartz
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO

# starting mysql server: mysql.server start

server.forward-headers-strategy=native

# ---- 内存/资源封顶（2G 小实例，1-2 并发用户；JVM 堆与 MySQL 在 docker-compose 里设） ----
# Tomcat 默认 200 工作线程，按低并发收到 20，连接/排队也收紧，省 native 内存。
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=50
server.tomcat.accept-count=20
# 数据库连接池按低并发收到 5，释放 MySQL 与驱动的每连接缓冲。
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
# Quartz 任务很少，工作线程从默认 10 收到 2。
spring.quartz.properties.org.quartz.threadPool.threadCount=2
# 限制整请求体大小（base64 图片上传路径本身已限制在 ~6MB）。
spring.servlet.multipart.max-request-size=12MB


