plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.5'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group "org.onepiece-battles"
version "EAST_BLUE_SAGA"
java.sourceCompatibility(JavaVersion.VERSION_17)

ext {
    assertj_db_version = "2.0.2"
    apache_commons_version = "3.12.0"
    flyway_version= "8.5.13"
    guava_version = "31.1-jre"
    jackson_dataformat_version = "2.13.3"
    h2_database_version = "1.4.200"
    mybatis_version = "3.5.9"
    mybatis_spring_version = "2.0.6"
    mybatis_spring_autoconfig_version = "2.2.2"
    mapstruct_version = "1.5.2.Final"
    testng_version = "7.1.0"
    mockito_version = "3.12.0"
    mockito_testng_version = "0.4.13"
    mysql_connector_version = "8.0.28"
    micrometer_registry_version = "1.9.3"
    json_web_token_version = "0.11.5"
    spring_security_version = "6.1.0"
    onepiece_infra_version = "1.0.5"
}

repositories {
    mavenCentral()
    maven {
        credentials{
            username = "PRIVATE-TOKEN"
            password = gitLabPrivateToken
        }
        url = "https://gitlab.com/api/v4/projects/46406398/packages/maven"
    }
    mavenLocal()
}

dependencies {
    implementation project(":api")
    implementation "org.onepiece-battles:infra-support:$onepiece_infra_version"
    annotationProcessor "org.onepiece-battles:infra-support:$onepiece_infra_version"

    // mapstruct
    implementation "org.mapstruct:mapstruct:$mapstruct_version"
    implementation "org.mapstruct:mapstruct-processor:$mapstruct_version"
    annotationProcessor "org.mapstruct:mapstruct-processor:$mapstruct_version"

    // spring security
    implementation "org.springframework.security:spring-security-core:$spring_security_version"
    implementation "org.springframework.security:spring-security-config:$spring_security_version"
    implementation "org.springframework.security:spring-security-web:$spring_security_version"
    implementation "io.jsonwebtoken:jjwt-impl:$json_web_token_version"
    implementation "io.jsonwebtoken:jjwt-api:$json_web_token_version"
    implementation "io.jsonwebtoken:jjwt-jackson:$json_web_token_version"


    // database
    implementation "org.flywaydb:flyway-core:$flyway_version"
    implementation "org.flywaydb:flyway-mysql:$flyway_version"
    implementation "mysql:mysql-connector-java:$mysql_connector_version"

    implementation "org.mybatis:mybatis:$mybatis_version"
    implementation "org.mybatis:mybatis-spring:$mybatis_spring_version"
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-autoconfigure:$mybatis_spring_autoconfig_version"
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // special
    implementation "io.micrometer:micrometer-registry-prometheus:$micrometer_registry_version"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework:spring-web"
    implementation "org.springframework:spring-webmvc"


    implementation "org.apache.commons:commons-lang3:$apache_commons_version"
    implementation "com.google.guava:guava:$guava_version"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$jackson_dataformat_version"

    // --- test dependencies ---
    testImplementation "com.h2database:h2:$h2_database_version"
    testImplementation "org.mockito:mockito-testng:$mockito_testng_version"
    testImplementation "org.mockito:mockito-core:$mockito_version"
    testImplementation "org.mockito:mockito-inline:$mockito_version"
    testImplementation "org.assertj:assertj-db:$assertj_db_version"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
}

test {
    useTestNG()
}

