plugins {
    id 'java'
}

group 'org.onepiece'
version 'EAST_BLUE_SAGA'

ext {
    mybatis_spring_boot_version = "2.1.3"
    mybatis_version = "3.5.5"
    mapstruct_version = "1.4.2.Final"
    guava_version = "27.0.1-jre"
    apache_poi_version = "4.1.2"
    mockito_version = "3.4.6"
    mockito_testng_version = "0.4.13"
    testng_version = "7.1.0"
    assertj_guava_version = "3.4.0"
    assertj_db_version = "2.0.2"
    mysql_connector_version = "8.0.21"
}
repositories {
    mavenCentral()
}

dependencies {
    implementation project(":EntityProcessor")
    implementation project(":api")
    annotationProcessor project(":EntityProcessor")
    implementation "org.mybatis:mybatis:$mybatis_version"
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:$mybatis_spring_boot_version"
    implementation "org.mapstruct:mapstruct:$mapstruct_version"
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.4.2.Final'
    implementation "com.google.guava:guava:$guava_version"
    implementation "org.apache.poi:poi-ooxml:$apache_poi_version"
    implementation "org.apache.poi:poi:$apache_poi_version"
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.11.2"
    implementation "org.flywaydb:flyway-core"
    implementation "mysql:mysql-connector-java:$mysql_connector_version"
    implementation "org.springframework.boot:spring-boot-starter-web"

    testImplementation "com.h2database:h2"
    testImplementation "org.testng:testng:$testng_version"
    testImplementation "org.mockito:mockito-core:$mockito_version"
    testImplementation "org.mockito:mockito-inline:$mockito_version"
    testImplementation "org.mockito:mockito-testng:$mockito_testng_version"
    testImplementation "org.assertj:assertj-guava:$assertj_guava_version"
    testImplementation "org.assertj:assertj-db:$assertj_db_version"
    testImplementation "org.springframework.boot:spring-boot-starter-test"

}

test {
    // uncomment testLogging to print logs to stdout
    // testLogging.showStandardStreams = true
}