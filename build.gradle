plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.5'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group "org.onepiece-battles"
version "EAST_BLUE_SAGA"
java.sourceCompatibility(JavaVersion.VERSION_17)

ext {
    mybatis_version = "3.5.9"
    mapstruct_version = "1.5.2.Final"
    guava_version = "31.1-jre"
    mockito_version = "3.4.6"
    testng_version = "7.1.0"
    flyway_mysql_version= "9.15.0"
    assertj_db_version = "2.0.2"
    mysql_connector_version = "8.0.28"
    jackson_dataformat_version = "2.13.3"
    apache_commons_version = "3.12.0"
    micrometer_registry_version = "1.9.3"
    h2_database_version = "1.4.200"
    mapstruct_version = "1.5.2.Final"
}

test {
    useTestNG()
}

dependencies {
    implementation project(":entity-processor")
    implementation project(":api")
    annotationProcessor project(":entity-processor")

    // mapstruct
    implementation "org.mapstruct:mapstruct:$mapstruct_version"
    implementation "org.mapstruct:mapstruct-processor:$mapstruct_version"
    annotationProcessor "org.mapstruct:mapstruct-processor:$mapstruct_version"

    // spring security
    implementation 'org.springframework.security:spring-security-core'


    // database
    implementation "org.flywaydb:flyway-mysql:$flyway_mysql_version"
    implementation "mysql:mysql-connector-java:$mysql_connector_version"
    implementation "org.mybatis:mybatis:$mybatis_version"
    implementation 'org.springframework:spring-jdbc'

    // special
    implementation "io.micrometer:micrometer-registry-prometheus:$micrometer_registry_version"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework:spring-web"
    implementation "org.springframework:spring-webmvc"


    implementation "org.apache.commons:commons-lang3:$apache_commons_version"
    implementation "com.google.guava:guava:$guava_version"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$jackson_dataformat_version"

    // --- test dependencies ---
    testImplementation "com.h2database:h2:$h2_database_version"
    testImplementation "org.mockito:mockito-core:$mockito_version"
    testImplementation "org.mockito:mockito-inline:$mockito_version"
    testImplementation "org.testng:testng:$testng_version"
    testImplementation "org.assertj:assertj-db:$assertj_db_version"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
}

repositories {
    mavenCentral()
    mavenLocal()
}

configurations.implementation {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}