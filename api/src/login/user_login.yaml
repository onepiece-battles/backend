apis:
  login:
    summary: user login by user id.
    post:
      tags:
        - login
      operation_id: userLogin
      requestBody:
        description: request to login to system
        content:
          application/json:
            schema:
              $ref: "#/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: user information
          content:
            application/json:
              schema:
                $ref: "#/schemas/User"

schemas:
  LoginRequest:
    type: object
    required:
      - user_id
    properties:
      user_id:
        type: string
        format: uuid

  User:
    type: object
    properties:
      user_id:
        type: string
        format: uuid
      user_name:
        type: string
      organization:
        type: string
