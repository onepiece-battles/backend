plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.openapi.generator' version '5.4.0'
}

ext {
    javax_validation_api_version = "2.0.1.Final"
    javax_annotation_api_version = "1.3.2"
    swagger_annotation = "2.2.2"
    jackson_databind_nullable_version = "0.2.2"
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation "javax.validation:validation-api:$javax_validation_api_version"
    implementation "javax.annotation:javax.annotation-api:$javax_annotation_api_version"
    implementation "io.swagger.core.v3:swagger-annotations:$swagger_annotation"
    implementation "org.openapitools:jackson-databind-nullable:$jackson_databind_nullable_version"
    implementation "org.springframework:spring-context"
    implementation "org.springframework:spring-web"
}

openApiGenerate {
    generatorName = "spring"
    library = "spring-boot"
    inputSpec = "$rootDir/onepiece-battles-api/api/openapi.yaml".toString()
    outputDir = "$rootDir/api".toString()
    apiPackage = "com.yichi.onepiece.api".toString()
    modelPackage = "com.yichi.onepiece.model".toString()
    configOptions = [
            basePackage: "com.yichi.onepiece".toString(),
            sourceFolder: "/src/main/java".toString(),
            useTags: true.toString(),
            interfaceOnly: true.toString(),
            skipDefaultInterface: true.toString(),
            generateSupportingFiles: false.toString(),
            serializableModel: true.toString(),
            serializationLibrary: "jackson".toString()
    ]

    globalProperties = [
            apis: "",
            models: "",
            skipFormModel: false.toString()
    ]
}

compileJava.dependsOn tasks.openApiGenerate
tasks.register("moveFile", Copy) {
    from layout.projectDirectory.dir("src")
    into layout.buildDirectory.dir("src")
}
tasks.register("deleteFolder", Delete) {
    delete layout.projectDirectory.dir("src")
}
assemble.finalizedBy(moveFile)
moveFile.finalizedBy(deleteFolder)

bootJar {
    enabled = false
}