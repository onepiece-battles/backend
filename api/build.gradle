plugins {
    id 'java'
    id "org.openapi.generator" version "5.4.0"
}

group 'org.onepiece'
version 'VERSION_1.0'

repositories {
    mavenCentral()
}

openApiGenerate {
    generatorName = "spring"
    library = "spring-boot"
    inputSpec = "$rootDir/onepiece-battles-api/api/openapi.yaml".toString()
    outputDir = "$rootDir/api".toString()
    apiPackage = "com.yichi.onepiece.api".toString()
    modelPackage = "com.yichi.onepiece.model".toString()
    configOptions = [
            basePackage: "com.yichi.onepiece".toString(),
            sourceFolder: "src/main/java".toString(),
            useTags: true.toString(),
            interfaceOnly: true.toString(),
            skipDefaultInterface: true.toString(),
            serializableModel: true.toString(),
            serializationLibrary: "jackson".toString()
    ]

    globalProperties = [
            apis: "",
            models: ""
    ]
}

compileJava.dependsOn tasks.openApiGenerate

dependencies {
    implementation "org.openapitools:openapi-generator:5.4.0"
    implementation 'org.springframework:spring-web:5.3.20'
    implementation 'org.springframework:spring-context:5.3.20'
    // javax.annotation-api and jackson-databind-nullable is included because
    // openapi-generator:5.4.0 doesn't include this.
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.2'
}
