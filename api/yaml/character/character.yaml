apis:
  add:
    summary: add new character into system
    post:
      tags:
        - "Character"
      operationId: addCharacter
      requestBody:
        description: request to add new character to system
        content:
          application/json:
            schema:
              $ref: "#/schemas/AddCharacterRequest"
        required: true
      responses:
        "200":
          description: character information
          content:
            application/json:
              schema:
                $ref: "#/schemas/Character"

  update_profile:
    summary: update image for character
    post:
      tags:
        - "Character"
      operationId: updateProfile
      requestBody:
        description: request to update picture to character
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                character_id:
                  type: string
                  format: uuid
                profile_image:
                  type: string
                  format: binary
        required: true
      responses:
        "200":
          description: profile information
          content:
            image/*:
              schema:
                type: string
                format: binary

  get_profile:
    summary: get profile image for character by id
    post:
      tags:
        - Character
      operationId: getProfile
      parameters:
        - name: id
          in: path
          description: character id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: the profile image
          content:
            multipart/form-data:
              schema:
                type: string
                format: binary

  eat_fruit:
    summary: character eat fruit
    post:
      tags:
        - "Character"
      operationId: eatFruit
      requestBody:
        description: request for character to eat fruit
        content:
          application/json:
            schema:
              $ref: "#/schemas/EatFruitRequest"
        required: true
      responses:
        "200":
          description: result and fruit information
          content:
            application/json:
              schema:
                $ref: "#/schemas/EatFruitResponse"

  list:
    summary: list all characters
    post:
      tags:
        - "Character"
      operationId: listCharacters
      requestBody:
        description: request for list all characters
        content:
          application/json:
            schema:
              $ref: "#/schemas/ListCharacterRequest"
        required: true
      responses:
        "200":
          description: list of characters
          content:
            application/json:
              schema:
                $ref: "#/schemas/ListCharacterResponse"

schemas:
  FruitInCharacter:
    description: >
      describe the fruit condition after it is eaten by character
    type: object
    required:
      - fruit_id
      - wake_up
    properties:
      fruit_id:
        type: string
        format: uuid
      wake_up:
        type: boolean

  Character:
    description: >
      Character that contains all necessary information.
    type: object
    required:
      - id
      - name
      - character_type
      - has_fruits
      - fruit_limit
      - group_gain
      - attack
      - defense
      - intelligence
      - blood
      - speed
      - magic
    properties:
      id:
        type: string
        format: uuid
      character_type:
        $ref: "#/schemas/CharacterType"
      name:
        type: string
      group_oid:
        description: Which group this character is in.
        type: string
      has_fruits:
        description: Whether this character has eaten fruit
        type: boolean
      fruits:
        type: array
        items:
          $ref: "#/schemas/FruitInCharacter"
      fruit_limit:
        description: Maximum number of fruit this character can eat.
        type: integer
        minimum: 1
        maximum: 2
      group_gain:
        type: integer
        minimum: 1
        maximum: 5
      attack:
        type: integer
        minimum: 10
        maximum: 1000
      defense:
        type: integer
        minimum: 10
        maximum: 1000
      intelligence:
        type: integer
        minimum: 70
        maximum: 260
      blood:
        type: integer
        minimum: 100
        maximum: 10000
      speed:
        type: integer
        minimum: 10
        maximum: 200
      magic:
        type: integer
        minimum: 10
        maximum: 50

  CharacterType:
    description: types that defines how character fight in battles.
    enum:
      - Katana
      - Fist
      - Foot
      - Shooter
      - Body
      - Science

  AddCharacterRequest:
    type: object
    required:
      - name
      - fruit_limit
      - group_gain
      - attack
      - defense
      - intelligence
      - blood
      - speed
      - magic
      - character_type
    properties:
      character_type:
        $ref: "#/schemas/CharacterType"
      name:
        type: string
      group_oid:
        description: Which group this character is in.
        type: string
      fruit_limit:
        description: Maximum number of fruit this character can eat.
        type: integer
        minimum: 1
        maximum: 2
      group_gain:
        type: integer
        minimum: 1
        maximum: 5
      attack:
        type: integer
        minimum: 10
        maximum: 1000
      defense:
        type: integer
        minimum: 10
        maximum: 1000
      intelligence:
        type: integer
        minimum: 70
        maximum: 260
      blood:
        type: integer
        minimum: 100
        maximum: 10000
      speed:
        type: integer
        minimum: 10
        maximum: 200
      magic:
        type: integer
        minimum: 10
        maximum: 50

  AddProfileResponse:
    type: object
    required:
      - character
    properties:
      character:
        $ref: "#/schemas/Character"

  EatFruitRequest:
    type: object
    required:
      - character_id
      - fruit_id
    properties:
      character_id:
        type: string
        format: uuid
      fruit_id:
        type: string
        format: uuid

  EatFruitResponse:
    type: object
    required:
      - character
      - fruit_message
    properties:
      character:
        $ref: "#/schemas/Character"
      fruit_message:
        type: string

  ListCharacterRequest:
    type: object
    required:
      - page_size
      - page_index
    properties:
      page_size:
        type: integer
        minimum: 0
      page_index:
        type: integer
        minimum: 1

  ListCharacterResponse:
    type: object
    properties:
      Characters:
        type: array
        items:
          $ref: "#/schemas/Character"
