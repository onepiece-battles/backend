apis:
  add:
    summary: create a new battle
    post:
      tags:
        - "Battle"
      operationId: addBattle
      requestBody:
        description: request to create a battle
        content:
          application/json:
            schema:
              $ref: "#/schemas/AddBattleRequest"
        required: true
      responses:
        "200":
          description: battle information
          content:
            application/json:
              schema:
                $ref: "#/schemas/Battle"

  start_battle:
    summary: start a battle that has been created.
    post:
      tags:
        - "Battle"
      operationId: startBattle
      requestBody:
        description: request to start a battle by battle id.
        content:
          application/json:
            schema:
              $ref: "#/schemas/StartBattleRequest"
        required: true
      responses:
        "200":
          description: battle process and battle result.
          content:
            application/json:
              schema:
                $ref: "#/schemas/StartBattleResponse"


schemas:
  BattleType:
    description: types of battles.
    enum:
      - Single
      - Group

  AddBattleRequest:
    type: object
    required:
      - user_id
      - initiate_character_id
      - receiver_character_id
    properties:
      user_id:
        type: string
        format: uuid
      initiate_character_id:
        type: string
        format: uuid
      receiver_character_id:
        type: string
        format: uuid
  Battle:
    type: object
    required:
      - action_timestamp
      - battle_id
      - user_id
      - initiate_character_id
      - receiver_character_id
      - type
    properties:
      action_timestamp:
        description: the timestamp this battle is created
        type: integer
        format: int64
      battle_id:
        type: string
        format: uuid
      user_id:
        type: string
        format: uuid
      initiate_character_id:
        type: string
        format: uuid
      receiver_character_id:
        type: string
        format: uuid
      type:
        $ref: "#/schemas/BattleType"

  BattleResult:
    type: object
    properties:
      winner_id:
        description: character id of winner.
        type: string
        format: uuid
      loser_id:
        description: character id of loser.
        type: string
        format: uuid
      winner_remain_blood_percentage:
        description: remaining blood/ total blood
        type: number
        format: double

  StartBattleRequest:
    type: object
    required:
      - battle_id
    properties:
      battle_id:
        type: string
        format: uuid

  StartBattleResponse:
    type: object
    properties:
      battle_id:
        type: string
        format: uuid
      result:
        $ref: "#/schemas/BattleResult"

