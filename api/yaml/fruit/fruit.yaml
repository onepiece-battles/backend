apis:
  add:
    summary: add new fruit
    post:
      tags:
        - "Fruit"
      operationId: addFruit
      requestBody:
        description: request to add new fruit to system
        content:
          application/json:
            schema:
              $ref: "#/schemas/AddFruitRequest"
        required: true
      responses:
        "200":
          description: fruit information
          content:
            application/json:
              schema:
                $ref: "#/schemas/Fruit"

  list:
    summary: list all fruits available
    post:
      tags:
        - "Fruit"
      operationId: listFruit
      requestBody:
        description: request to list all fruits available
        content:
          application/json:
            schema:
              $ref: "#/schemas/ListFruitRequest"
        required: true
      responses:
        "200":
          description: fruit information
          content:
            application/json:
              schema:
                $ref: "#/schemas/ListFruitResponse"

  update:
    summary: update information about fruit
    post:
      tags:
        - "Fruit"
      operationId: updateFruit
      requestBody:
        description: request to update fruit
        content:
          application/json:
            schema:
              $ref: "#/schemas/UpdateFruitRequest"
        required: true
      responses:
        "200":
          description: character information
          content:
            application/json:
              schema:
                $ref: "#/schemas/Fruit"

schemas:
  FruitType:
    description: different types of fruit
    enum:
      - Paramecia
      - Logia
      - Zoan
      - Ancient_Zoan
      - Mythical_Zoan
      - Artificial_Zoan

  Fruit:
    description: all information about fruit
    type: object
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
        # character id
      owner_id:
        type: string
        format: uuid
      fruit_type:
        $ref: "#/schemas/FruitType"
      magic_consume:
        type: integer
      attack_strengthen:
        type: integer
      intelligence_strengthen:
        type: integer
      blood_strengthen:
        type: integer
      speed_strengthen:
        type: integer

  AddFruitRequest:
    type: object
    properties:
      name:
        type: string
      fruit_type:
        $ref: "#/schemas/FruitType"
      group_gain_strengthen:
        type: integer
      magic_consume:
        type: integer
      attack_strengthen:
        type: integer
      defense_strengthen:
        type: integer
      intelligence_strengthen:
        type: integer
      blood_strengthen:
        type: integer
      speed_strengthen:
        type: integer

  ListFruitRequest:
    type: object
    required:
      - page_size
      - page_index
    properties:
      page_size:
        type: integer
        minimum: 0
      page_index:
        type: integer
        minimum: 1

  ListFruitResponse:
    type: object
    properties:
      fruits:
        type: array
        items:
          $ref: "#/schemas/Fruit"

  UpdateFruitRequest:
    type: object
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      owner_id:
        type: string
        format: uuid
      fruit_type:
        $ref: "#/schemas/FruitType"
      group_gain_strengthen:
        type: integer
      magic_consume:
        type: integer
      attack_strengthen:
        type: integer
      defense_strengthen:
        type: integer
      intelligence_strengthen:
        type: integer
      blood_strengthen:
        type: integer
      speed_strengthen:
        type: integer
