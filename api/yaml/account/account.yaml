apis:
  login:
    summary: user login by user name and password.
    post:
      tags:
        - "Account"
      operationId: login
      requestBody:
        description: request to login to system.
        content:
          application/json:
            schema:
              $ref: "#/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: user information
          content:
            application/json:
              schema:
                $ref: "#/schemas/LoginResponse"
  logout:
    summary: user logout
    post:
      tags:
        - "Account"
      operationId: logout
      requestBody:
        description: request to logout from system
        content:
          application/json:
            schema:
              $ref: "#/schemas/LogoutRequest"
        required: true
      responses:
        "200":
          description: whether user has successfully logout of system.
          content:
            application/json:
              schema:
                $ref: "#/schemas/LogoutResponse"

  register:
    summary: register new account
    post:
      tags:
        - "Account"
      operationId: register
      requestBody:
        description: request to register new account.
        content:
          application/json:
            schema:
              $ref: "#/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: register success
          content:
            application/json:
              schema:
                $ref: "#/schemas/RegisterResponse"
schemas:
  LoginRequest:
    type: object
    required:
      - user_name
      - password
      - email
    properties:
      user_name:
        type: string
      email:
        type: string
      organization:
        type: string
      password:
        type: string

  LoginResponse:
    type: object
    properties:
      user_info:
        $ref: "#/schemas/UserInfo"
      verification:
        $ref: "../common/i18n.yaml#/schemas/I18nText"

  LogoutRequest:
    type: object
    properties:
      user_id:
        type: string
        format: uuid

  LogoutResponse:
    type: object
    properties:
      user_name:
        type: string
      logout_result:
        description: whether user has successfully logout.
        type: string

  RegisterRequest:
    type: object
    required:
      - user_name
      - email
      - password
      - confirmed_password
      - organization
    properties:
      user_name:
        type: string
      email:
        type: string
      password:
        type: string
      confirmed_password:
        type: string
      organization:
        type: string

  RegisterResponse:
    type: object
    required:
      - register_result
    properties:
      register_result:
        description: Whether user has successfully registered into system.
        type: boolean
      verification:
        description: OK if successfully registered, otherwise explain why register failed.
        $ref: "../common/i18n.yaml#/schemas/I18nText"

  UserInfo:
    type: object
    required:
      - user_id
      - user_name
    properties:
      user_id:
        type: string
        format: uuid
      user_name:
        type: string
      organization:
        type: string
