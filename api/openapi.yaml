openapi: "3.0.2"
info:
  title: OnePiece APIs
  version: 1.0.0
servers:
  - url: http://localhost:8080

tags:
  - name: "Account"
  - name: "Character"
  - name: "Fruit"
  - name: "Battle"
paths:
  # Account apis
  /api/onepiece/account/login:
    $ref: "yaml/account/account.yaml#/apis/login"
  /api/onepiece/account/register:
    $ref: "yaml/account/account.yaml#/apis/register"
  /api/onepiece/account/logout:
    $ref: "yaml/account/account.yaml#/apis/logout"

  # Character apis
  /api/onepiece/character/add:
    $ref: "yaml/character/character.yaml#/apis/add"
  /api/onepiece/character/update_profile:
    $ref: "yaml/character/character.yaml#/apis/update_profile"
  /api/onepiece/character/get_profile/{id}:
    $ref: "yaml/character/character.yaml#/apis/get_profile"
  /api/onepiece/character/eat_fruit:
    $ref: "yaml/character/character.yaml#/apis/eat_fruit"
  /api/onepiece/character/list:
    $ref: "yaml/character/character.yaml#/apis/list"

  # Fruit apis
  /api/onepiece/fruit/add:
    $ref: "yaml/fruit/fruit.yaml#/apis/add"
  /api/onepiece/fruit/list:
    $ref: "yaml/fruit/fruit.yaml#/apis/list"
  /api/onepiece/fruit/update:
    $ref: "yaml/fruit/fruit.yaml#/apis/update"

  # Battle apis
  /api/onepiece/battle/add:
    $ref: "yaml/battle/battle.yaml#/apis/add"
  /api/onepiece/battle/start_battle:
    $ref: "yaml/battle/battle.yaml#/apis/start_battle"
